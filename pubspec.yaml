name: doc_reader
description: "Lector de documentos sin anuncios: PDF, Word, Excel y texto."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.14.0

dependencies:
  archive: ^4.7.1
  collection: ^1.19.1
  file_picker: ^13.3.3
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  flutter_tts: ^4.2.5
  go_router: ^18.1.4
  google_fonts: ^9.0.0
  intl: ^0.20.2
  path: ^1.9.1
  path_provider: ^2.1.6
  pdfrx: ^2.12.1
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  two_dimensional_scrollables: ^0.5.6
  uuid: ^4.6.0
  xml: ^7.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/samples/
    - assets/google_fonts/
